[package]
name = "pulsestream-worker"
description = "PulseStream worker: bounded, lease-based processing of durably accepted events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Deterministic test processors for this and dependent crates' tests.
test-util = ["dep:serde_json"]

[dependencies]
pulsestream-core.workspace = true
pulsestream-store.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
pulsestream-store = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

# Manual retry/dead-letter smoke harness; see the file's header.
[[example]]
name = "scripted_worker"
required-features = ["test-util"]

[lints]
workspace = true
