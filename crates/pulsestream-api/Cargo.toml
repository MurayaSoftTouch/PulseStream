[package]
name = "pulsestream-api"
description = "PulseStream HTTP API process: durable, idempotent event admission and status lookup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
pulsestream-core.workspace = true
pulsestream-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false }
pulsestream-store = { workspace = true, features = ["test-util"] }
pulsestream-worker.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tower.workspace = true

[lints]
workspace = true
