[package]
name = "pulsestream-store"
description = "PulseStream durable event store (PostgreSQL): admission, idempotency, claiming, and leases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Disposable per-test databases and a toggleable TCP proxy for outage tests.
test-util = ["tokio/io-util", "tokio/net", "tokio/rt"]

[dependencies]
pulsestream-core.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
pulsestream-store = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
